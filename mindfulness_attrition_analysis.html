<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>正念干预满意度高但离职率未降的归因与优化</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&family=Noto+Serif+SC:wght@400;600;700&display=swap');
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{
    --sky:#5B8FA8;--sky-light:#D6E8F0;--sky-pale:#EBF3F8;
    --sage:#7BA89C;--sage-light:#D6E8E0;
    --mint:#6EC4B8;--mint-light:#D4EDE8;
    --lavender:#9B8FA8;--lavender-light:#E8E3EE;
    --warm:#E8C89E;--warm-light:#FBF2E4;
    --cream:#F5F0E1;--cream-pale:#FAF8F2;
    --peach:#F5E0D0;--deep:#3D3D3D;--soft:#6B6B6B;--surface:#F0ECE4;
    --alert:#D4896A;--alert-light:#F5DDD0;
  }
  html{scroll-behavior:smooth}
  body{font-family:'Noto Sans SC',sans-serif;background:var(--cream-pale);color:var(--deep);overflow-x:hidden;line-height:1.6}

  .progress-bar{position:fixed;top:0;left:0;height:3px;z-index:1000;background:linear-gradient(90deg,var(--sky),var(--mint),var(--sage));width:0%;transition:width .1s linear}

  .nav-dots{position:fixed;right:24px;top:50%;transform:translateY(-50%);z-index:999;display:flex;flex-direction:column;gap:12px}
  .nav-dot{width:10px;height:10px;border-radius:50%;background:rgba(0,0,0,.12);cursor:pointer;transition:all .4s cubic-bezier(.4,0,.2,1)}
  .nav-dot.active{background:var(--sky);transform:scale(1.4);box-shadow:0 0 12px rgba(91,143,168,.4)}
  .nav-dot:hover{transform:scale(1.3)}
  .nav-dot .tooltip{position:absolute;right:22px;top:50%;transform:translateY(-50%);background:var(--deep);color:#fff;padding:4px 12px;border-radius:6px;font-size:11px;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .3s}
  .nav-dot:hover .tooltip{opacity:1}

  /* Hero */
  .hero{min-height:100vh;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;background:linear-gradient(160deg,var(--sky-pale) 0%,var(--cream) 40%,var(--lavender-light) 100%)}
  .hero-bg-shapes{position:absolute;inset:0;pointer-events:none;overflow:hidden}
  .hero-shape{position:absolute;border-radius:50%;opacity:.1}
  .hero-shape:nth-child(1){width:400px;height:400px;background:var(--sky);top:-100px;right:-80px;animation:floatShape 8s ease-in-out infinite}
  .hero-shape:nth-child(2){width:300px;height:300px;background:var(--mint);bottom:-60px;left:-60px;animation:floatShape 10s ease-in-out infinite reverse}
  .hero-shape:nth-child(3){width:220px;height:220px;background:var(--sage);top:30%;left:10%;animation:floatShape 12s ease-in-out infinite}
  @keyframes floatShape{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(20px,-20px) scale(1.05)}}
  .hero-content{position:relative;z-index:2;text-align:center;max-width:900px;padding:40px 24px;width:100%}
  .hero-badge{display:inline-block;padding:6px 20px;background:rgba(91,143,168,.1);border-radius:20px;font-size:13px;color:var(--sky);font-weight:500;letter-spacing:2px;margin-bottom:20px;opacity:0;animation:fadeUp .8s .2s forwards}
  .hero-title{font-family:'Noto Serif SC',serif;font-size:clamp(26px,4.5vw,44px);font-weight:700;line-height:1.4;margin-bottom:12px;opacity:0;animation:fadeUp .8s .4s forwards}
  .hero-title .accent{color:var(--sky)}
  .hero-title .alert{color:var(--alert)}
  .hero-sub{font-size:14px;color:var(--soft);font-weight:300;margin-bottom:24px;opacity:0;animation:fadeUp .8s .6s forwards}
  .hero-illustration{opacity:0;animation:fadeUp 1s .8s forwards;width:100%}
  .hero-illustration svg{width:100%;height:auto;display:block}
  .scroll-hint{position:absolute;bottom:36px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:10px;opacity:0;animation:scrollHintIn 1s 1.2s forwards}
  .scroll-hint-text{font-size:11px;letter-spacing:2px;color:var(--soft);opacity:.6}
  .scroll-hint-arrow-wrap{width:20px;height:40px;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:flex-end}
  .scroll-hint-arrow-wrap::before{content:'';position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:2px;height:100%;background:linear-gradient(to bottom,transparent 0%,var(--sky) 100%);border-radius:1px;animation:arrowPulse 2s ease-in-out infinite}
  .scroll-hint-arrow-wrap::after{content:'';position:absolute;bottom:0;left:50%;transform:translateX(-50%) rotate(-45deg);width:8px;height:8px;border-left:2px solid var(--sky);border-bottom:2px solid var(--sky);animation:arrowPulse 2s ease-in-out infinite}
  @keyframes arrowPulse{0%,100%{opacity:.3;transform:translateX(-50%) translateY(0)}50%{opacity:.8;transform:translateX(-50%) translateY(4px)}}
  @keyframes scrollHintIn{from{opacity:0;transform:translateX(-50%) translateY(20px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
  @keyframes fadeUp{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:translateY(0)}}

  /* Visual sections */
  .visual-section{padding:60px 24px;position:relative}
  .visual-section:nth-child(odd){background:var(--cream-pale)}
  .visual-section:nth-child(even){background:var(--surface)}
  .visual-container{max-width:900px;margin:0 auto}
  .section-label{text-align:center;margin-bottom:32px}
  .section-tag{display:inline-block;padding:5px 16px;border-radius:16px;font-size:12px;letter-spacing:2px;font-weight:500}
  .section-tag.cause{background:rgba(212,137,106,.1);color:var(--alert)}
  .section-tag.optimize{background:rgba(110,196,184,.1);color:var(--mint)}
  .section-tag.longterm{background:rgba(91,143,168,.1);color:var(--sky)}
  .section-tag.sdgs{background:rgba(232,200,158,.15);color:#A08050}
  .section-title{font-family:'Noto Serif SC',serif;font-size:clamp(22px,3.5vw,32px);font-weight:700;margin-top:10px}

  .svg-panel{width:100%;margin:0 auto}
  .svg-panel svg{width:100%;height:auto;display:block;border-radius:20px;filter:drop-shadow(0 8px 30px rgba(0,0,0,.04))}

  .footer{padding:50px 24px;text-align:center;background:linear-gradient(180deg,var(--cream-pale),var(--surface))}
  .footer-title{font-family:'Noto Serif SC',serif;font-size:22px;font-weight:700;margin-bottom:8px}
  .footer-text{font-size:13px;color:var(--soft);max-width:500px;margin:0 auto}

  /* Scroll Reveal */
  .reveal{opacity:0;transform:translateY(40px);transition:opacity .8s cubic-bezier(.4,0,.2,1),transform .8s cubic-bezier(.4,0,.2,1)}
  .reveal.visible{opacity:1;transform:translateY(0)}

  /* ===== SVG ANIMATIONS ===== */
  .svg-float{opacity:1}.svg-float.anim-active{animation:svgFloat 4s ease-in-out infinite}
  .svg-float-d.anim-active{animation:svgFloat 4s ease-in-out 1s infinite}
  .svg-float-d2.anim-active{animation:svgFloat 4s ease-in-out 2s infinite}
  .svg-float-d3.anim-active{animation:svgFloat 4s ease-in-out 3s infinite}
  .svg-pulse{opacity:0}.svg-pulse.anim-active{animation:svgPulse 3s ease-in-out infinite}
  .svg-breathe{opacity:1}.svg-breathe.anim-active{animation:svgBreathe 5s ease-in-out infinite}
  .svg-sway{opacity:1}.svg-sway.anim-active{animation:svgSway 6s ease-in-out infinite}
  .svg-glow{opacity:0}.svg-glow.anim-active{animation:svgGlow 4s ease-in-out infinite}
  .svg-draw{stroke-dasharray:1000;stroke-dashoffset:1000;opacity:1}.svg-draw.anim-active{animation:svgDraw 3s ease forwards}
  .svg-fade-in{opacity:0}.svg-fade-in.anim-active{animation:svgFadeIn 1.2s ease forwards}
  .svg-fade-in-d{opacity:0}.svg-fade-in-d.anim-active{animation:svgFadeIn 1.2s .4s ease forwards}
  .svg-fade-in-d2{opacity:0}.svg-fade-in-d2.anim-active{animation:svgFadeIn 1.2s .8s ease forwards}
  .svg-fade-in-d3{opacity:0}.svg-fade-in-d3.anim-active{animation:svgFadeIn 1.2s 1.2s ease forwards}
  .svg-fade-in-d4{opacity:0}.svg-fade-in-d4.anim-active{animation:svgFadeIn 1.2s 1.6s ease forwards}
  .svg-fade-in-d5{opacity:0}.svg-fade-in-d5.anim-active{animation:svgFadeIn 1.2s 2s ease forwards}
  .svg-scale-in{transform:scale(0);opacity:0}.svg-scale-in.anim-active{animation:svgScaleIn .8s cubic-bezier(.34,1.56,.64,1) forwards}
  .svg-ripple{transform:scale(0);opacity:0}.svg-ripple.anim-active{animation:svgRipple 2.5s ease-out forwards}
  .svg-particle{opacity:0}.svg-particle.anim-active{animation:svgParticle 4s ease-in-out infinite}
  .svg-rise{opacity:0;transform:translateY(20px)}.svg-rise.anim-active{animation:svgRise 1.5s ease forwards}
  .svg-shimmer{opacity:0}.svg-shimmer.anim-active{animation:svgShimmer 3s ease-in-out infinite}

  /* NEW: Water drop animation */
  .svg-drop{opacity:0;transform:translateY(-30px)}.svg-drop.anim-active{animation:svgDrop 2.5s ease-in infinite}
  .svg-drop-d.anim-active{animation:svgDrop 2.5s ease-in .8s infinite}
  .svg-drop-d2.anim-active{animation:svgDrop 2.5s ease-in 1.6s infinite}
  .svg-drop-d3.anim-active{animation:svgDrop 2.5s ease-in 2.4s infinite}

  /* NEW: Path draw with variable speed */
  .svg-draw-slow{stroke-dasharray:2000;stroke-dashoffset:2000;opacity:1}.svg-draw-slow.anim-active{animation:svgDraw 5s ease forwards}

  /* NEW: Swing animation */
  .svg-swing{opacity:1;transform-origin:top center}.svg-swing.anim-active{animation:svgSwing 4s ease-in-out infinite}

  /* NEW: Ripple rings */
  .svg-ring{transform:scale(0);opacity:0}.svg-ring.anim-active{animation:svgRing 3s ease-out infinite}
  .svg-ring-d.anim-active{animation:svgRing 3s ease-out 1s infinite}
  .svg-ring-d2.anim-active{animation:svgRing 3s ease-out 2s infinite}

  /* NEW: Slide in from left */
  .svg-slide-l{opacity:0;transform:translateX(-40px)}.svg-slide-l.anim-active{animation:svgSlideL 1s ease forwards}
  /* NEW: Slide in from right */
  .svg-slide-r{opacity:0;transform:translateX(40px)}.svg-slide-r.anim-active{animation:svgSlideR 1s ease forwards}

  @keyframes svgFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
  @keyframes svgPulse{0%,100%{transform:scale(1);opacity:.4}50%{transform:scale(1.15);opacity:.8}}
  @keyframes svgBreathe{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
  @keyframes svgSway{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg)}}
  @keyframes svgGlow{0%,100%{opacity:.08}50%{opacity:.25}}
  @keyframes svgDraw{to{stroke-dashoffset:0}}
  @keyframes svgFadeIn{to{opacity:1}}
  @keyframes svgScaleIn{to{transform:scale(1);opacity:1}}
  @keyframes svgRipple{0%{transform:scale(0);opacity:.5}100%{transform:scale(2.5);opacity:0}}
  @keyframes svgParticle{0%{opacity:0;transform:translateY(0) translateX(0)}25%{opacity:.5}50%{opacity:.3;transform:translateY(-12px) translateX(6px)}75%{opacity:.15}100%{opacity:0;transform:translateY(-24px) translateX(-4px)}}
  @keyframes svgRise{to{opacity:1;transform:translateY(0)}}
  @keyframes svgShimmer{0%,100%{opacity:0}50%{opacity:.6}}
  @keyframes svgDrop{0%{opacity:0;transform:translateY(-30px)}15%{opacity:.7}60%{opacity:.5;transform:translateY(40px)}80%{opacity:0;transform:translateY(50px)}100%{opacity:0;transform:translateY(50px)}}
  @keyframes svgSwing{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
  @keyframes svgRing{0%{transform:scale(.3);opacity:.6}100%{transform:scale(2);opacity:0}}
  @keyframes svgSlideL{to{opacity:1;transform:translateX(0)}}
  @keyframes svgSlideR{to{opacity:1;transform:translateX(0)}}

  @media(max-width:768px){
    .nav-dots{right:12px;gap:10px}
    .nav-dot{width:8px;height:8px}
    .nav-dot .tooltip{display:none}
  }
</style>

<style>
.plan-back-btn {
    position: fixed;
    top: 20px;
    left: 20px;
    z-index: 9999;
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 10px 18px;
    background: rgba(255,255,255,0.92);
    backdrop-filter: blur(12px);
    border: 1px solid rgba(0,0,0,0.08);
    border-radius: 12px;
    font-size: 13px;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    color: #5A5265;
    cursor: pointer;
    text-decoration: none;
    box-shadow: 0 2px 12px rgba(0,0,0,0.08);
    transition: all 0.2s;
}
.plan-back-btn:hover {
    background: rgba(255,255,255,0.98);
    box-shadow: 0 4px 20px rgba(0,0,0,0.12);
    transform: translateY(-1px);
}
.plan-back-btn .back-arrow { font-size: 16px; }
</style>
</head>
<body>

<div class="progress-bar" id="progressBar"></div>

<nav class="nav-dots" id="navDots">
  <div class="nav-dot active" data-target="hero"><span class="tooltip">首页</span></div>
  <div class="nav-dot" data-target="cause"><span class="tooltip">归因分析</span></div>
  <div class="nav-dot" data-target="optimize"><span class="tooltip">优化路径</span></div>
  <div class="nav-dot" data-target="longterm"><span class="tooltip">长效保障</span></div>
  <div class="nav-dot" data-target="sdgs"><span class="tooltip">SDGs</span></div>
</nav>

<!-- ===== HERO: The Paradox Scene ===== -->
<section class="hero" id="hero">
  <div class="hero-bg-shapes"><div class="hero-shape"></div><div class="hero-shape"></div><div class="hero-shape"></div></div>
  <div class="hero-content">
    <div class="hero-badge">归因与优化</div>
    <h1 class="hero-title">正念干预<span class="accent">满意度高</span> 但<span class="alert">离职率未降</span></h1>
    <p class="hero-sub">3个月正念冥想干预后的深层归因分析与系统优化路径</p>
    <div class="hero-illustration svg-anim-group">
      <svg viewBox="0 0 800 500" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect x="0" y="0" width="800" height="500" rx="20" fill="#FAF8F2"/>
        <defs>

          <linearGradient id="hSky" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#EBF3F8" stop-opacity=".5"/><stop offset="100%" stop-color="#FAF8F2" stop-opacity="0"/></linearGradient>
          <linearGradient id="bridgeGrad" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#6EC4B8"/><stop offset="45%" stop-color="#6EC4B8"/><stop offset="55%" stop-color="#D4896A"/><stop offset="100%" stop-color="#D4896A"/>
        </defs>
        <rect x="0" y="0" width="800" height="260" rx="20" fill="url(#hSky)"/>

        <!-- Sun with rays -->

          <line x1="636" y1="65" x2="624" y2="65" stroke="#E8C89E" stroke-width="2" opacity=".65" stroke-linecap="round"/>
          <line x1="650" y1="96" x2="640" y2="106" stroke="#E8C89E" stroke-width="2" opacity=".65" stroke-linecap="round"/>
        </g>

        <!-- Clouds floating -->
        <g class="svg-float"><ellipse cx="120" cy="48" rx="48" ry="18" fill="#fff" opacity=".8"/><ellipse cx="152" cy="38" rx="34" ry="14" fill="#fff" opacity=".7"/><ellipse cx="88" cy="42" rx="24" ry="11" fill="#fff" opacity=".6"/></g>
        <g class="svg-float-d"><ellipse cx="430" cy="38" rx="38" ry="15" fill="#fff" opacity=".7"/><ellipse cx="458" cy="28" rx="28" ry="12" fill="#fff" opacity=".6"/></g>

        <g class="svg-rise" style="animation-delay:1.8s">

<script>
const progressBar=document.getElementById('progressBar');
window.addEventListener('scroll',()=>{const s=window.scrollY;const d=document.documentElement.scrollHeight-window.innerHeight;progressBar.style.width=(s/d)*100+'%'});

const dots=document.querySelectorAll('.nav-dot');
const sections=['hero','cause','optimize','longterm','sdgs'];
dots.forEach(dot=>{dot.addEventListener('click',()=>{document.getElementById(dot.getAttribute('data-target')).scrollIntoView({behavior:'smooth'})})});
const sectionEls=sections.map(id=>document.getElementById(id));
window.addEventListener('scroll',()=>{let c=0;sectionEls.forEach((el,i)=>{if(el.getBoundingClientRect().top<=window.innerHeight/2)c=i});dots.forEach((dot,i)=>{dot.classList.toggle('active',i===c)})});

const revealElements=document.querySelectorAll('.reveal');
const revealObserver=new IntersectionObserver(entries=>{entries.forEach(entry=>{if(entry.isIntersecting)entry.target.classList.add('visible')})},{threshold:.1,rootMargin:'0px 0px -30px 0px'});
revealElements.forEach(el=>revealObserver.observe(el));

const svgAnimGroups=document.querySelectorAll('.svg-anim-group');
const svgAnimObserver=new IntersectionObserver(entries=>{entries.forEach(entry=>{if(entry.isIntersecting){const els=entry.target.querySelectorAll('.svg-float,.svg-float-d,.svg-float-d2,.svg-float-d3,.svg-pulse,.svg-breathe,.svg-sway,.svg-swing,.svg-glow,.svg-draw,.svg-draw-slow,.svg-fade-in,.svg-fade-in-d,.svg-fade-in-d2,.svg-fade-in-d3,.svg-fade-in-d4,.svg-fade-in-d5,.svg-scale-in,.svg-ripple,.svg-particle,.svg-rise,.svg-shimmer,.svg-drop,.svg-drop-d,.svg-drop-d2,.svg-drop-d3,.svg-ring,.svg-ring-d,.svg-ring-d2,.svg-slide-l,.svg-slide-r');els.forEach(el=>el.classList.add('anim-active'));svgAnimObserver.unobserve(entry.target)}})},{threshold:.12,rootMargin:'0px 0px -20px 0px'});
svgAnimGroups.forEach(group=>svgAnimObserver.observe(group));

window.addEventListener('scroll',()=>{const s=window.scrollY;document.querySelectorAll('.hero-shape').forEach((shape,i)=>{shape.style.transform=`translateY(${s*(.03+i*.02)}px)`})});
</script>

})();
